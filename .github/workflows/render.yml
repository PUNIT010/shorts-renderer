name: Render Short

on:
  schedule:
    - cron: "30 0 * * 1,3,5,0"   # 06:00 IST on Mon, Wed, Fri, Sun
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAKE_URL: ${{ vars.MAKE_WEBHOOK_URL }}
      MAKE_TOKEN: ${{ vars.MAKE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Install Python packages
        run: pip install edge-tts requests pillow

      - name: Get today's script from Make
        run: |
          for i in 1 2 3 4 5; do
            jq -nc --arg t "$MAKE_TOKEN" '{event:"generate",token:$t}' \
              | curl -sS --max-time 90 -X POST -H "Content-Type: application/json" -d @- "$MAKE_URL" -o content.txt || true
            if grep -q '###' content.txt 2>/dev/null; then break; fi
            echo "Attempt $i returned no script:"; cat content.txt 2>/dev/null; echo
            sleep 20
          done
          grep -q '###' content.txt || { echo "Make did not return a script"; exit 1; }
          head -c 400 content.txt; echo

      - name: Render video
        run: python render.py content.txt

      - name: Publish video as a release asset
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="short-$(date -u +%Y%m%d%H%M)"
          gh release create "$TAG" out/short.mp4 out/meta.json --title "$TAG" --notes "Auto-rendered Short"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tell Make to upload the video
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          jq -nc --arg t "$MAKE_TOKEN" --arg tag "$TAG" --rawfile c content.txt \
            '{event:"upload",token:$t,tag:$tag,content:$c}' \
            | curl -sS --fail --max-time 240 -X POST -H "Content-Type: application/json" -d @- "$MAKE_URL"

      - name: Alert Make if anything failed
        if: failure()
        run: |
          jq -nc --arg t "$MAKE_TOKEN" --arg r "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{event:"failed",token:$t,run:$r}' \
            | curl -sS --max-time 30 -X POST -H "Content-Type: application/json" -d @- "$MAKE_URL" || true
